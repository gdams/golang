# This workflow is triggered by LUCI (via the gabuilder bridge) to run
# Go tests on windows/arm64 GitHub Actions runners. It checks out the
# Go source tree at the requested commit, bootstraps the toolchain,
# and runs the test suite. Results are uploaded as artifacts and the
# workflow exit status is used by the bridge to report back to LUCI.

name: windows-arm64-test

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Go repository commit SHA to test"
        required: true
        type: string
      build_id:
        description: "LUCI build ID for correlation"
        required: false
        type: string
        default: ""
      test_shards:
        description: "Number of test shards (GO_TEST_SHARDS)"
        required: false
        type: string
        default: "1"
      builder_name:
        description: "GO_BUILDER_NAME to set in environment"
        required: false
        type: string
        default: "gotip-windows-arm64-github"
      repository:
        description: "Go repository URL to clone"
        required: false
        type: string
        default: "https://go.googlesource.com/go"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      GO_BUILDER_NAME: ${{ inputs.builder_name }}
      GO_TEST_SHARDS: ${{ inputs.test_shards }}
      GOROOT_BOOTSTRAP: C:\hostedtoolcache\go\bootstrap

    steps:
      - name: Checkout Go source
        shell: pwsh
        run: |
          # Clone into a temp location then move contents into the workspace.
          # The workspace may already contain the workflow repo checkout.
          $src = "$env:TEMP\go-src"
          git clone --depth 1 --no-checkout "${{ inputs.repository }}" $src
          Push-Location $src
          git fetch --depth 1 origin ${{ inputs.commit_sha }}
          git checkout ${{ inputs.commit_sha }}
          Pop-Location
          # Move everything (including .git) into the workspace root.
          Get-ChildItem -Path $src -Force | Move-Item -Destination . -Force

      - name: Set up bootstrap Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Record bootstrap location
        shell: pwsh
        run: |
          $bootstrapDir = Split-Path -Parent (Get-Command go).Source
          # Go bootstrap expects GOROOT_BOOTSTRAP to point to the root,
          # not the bin directory.
          $goroot = Split-Path -Parent $bootstrapDir
          echo "GOROOT_BOOTSTRAP=$goroot" >> $env:GITHUB_ENV
          echo "Bootstrap GOROOT: $goroot"
          go version

      - name: Install llvm-mingw toolchain
        shell: pwsh
        run: |
          # Go's CGO on Windows expects a MinGW-compatible C toolchain.
          # The Azure startup.ps1 notes that LUCI builders get compilers
          # via CIPD; for GitHub Actions we download llvm-mingw directly.
          # See: https://github.com/golang/build/blob/master/env/windows-arm64/azure/startup.ps1
          $version = "20250514"
          $archive = "llvm-mingw-${version}-ucrt-aarch64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/${version}/${archive}"
          $dest = "C:\llvm-mingw"

          Write-Host "Downloading llvm-mingw from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\$archive" -UseBasicParsing
          Write-Host "Extracting to $dest"
          Expand-Archive -Path "$env:TEMP\$archive" -DestinationPath "C:\"
          Rename-Item "C:\llvm-mingw-${version}-ucrt-aarch64" $dest

          # Put llvm-mingw at the front of PATH so its gcc/clang shadow
          # the x86-64 MinGW gcc that ships with Git for Windows.
          echo "$dest\bin" >> $env:GITHUB_PATH
          $env:PATH = "$dest\bin;$env:PATH"

          Write-Host "CC: $(gcc --version 2>&1 | Select-Object -First 1)"
          Write-Host "Target: $(gcc -dumpmachine)"

      - name: Install crypto/x509 test root
        shell: pwsh
        run: |
          # The Go crypto/x509 tests require a specific test root CA.
          # See: https://github.com/golang/build/blob/master/env/windows-arm64/azure/startup.ps1
          $certUrl = "https://storage.googleapis.com/go-builder-data/platform_root_cert.pem"
          $certFile = "$env:TEMP\test_root.pem"
          Invoke-WebRequest -Uri $certUrl -OutFile $certFile -UseBasicParsing
          Import-Certificate -FilePath $certFile -CertStoreLocation "Cert:\LocalMachine\Root"
          Write-Host "Installed crypto/x509 test root certificate"

      - name: Disable Windows Defender real-time monitoring
        shell: pwsh
        run: |
          # Real-time scanning slows down compilation significantly.
          # The Azure startup.ps1 does the same.
          Set-MpPreference -DisableRealtimeMonitoring $true
          Write-Host "Disabled Windows Defender real-time monitoring"

      - name: Build Go toolchain
        shell: pwsh
        working-directory: src
        run: |
          echo "::group::make.bat"
          .\make.bat
          echo "::endgroup::"

      - name: Run tests
        id: run_tests
        shell: pwsh
        working-directory: src
        run: |
          $env:PATH = "${{ github.workspace }}\bin;$env:PATH"
          echo "Using Go: $(go version)"
          echo "Builder: $env:GO_BUILDER_NAME"
          echo "Build ID: ${{ inputs.build_id }}"
          echo "::group::run.bat"
          .\run.bat 2>&1 | Tee-Object -FilePath "${{ github.workspace }}\test-output.txt"
          $exitCode = $LASTEXITCODE
          echo "::endgroup::"
          echo "test_exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit $exitCode

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.commit_sha }}
          path: test-output.txt
          retention-days: 7

      - name: Upload build metadata
        if: always()
        shell: pwsh
        run: |
          $meta = @{
            commit_sha = "${{ inputs.commit_sha }}"
            build_id = "${{ inputs.build_id }}"
            builder_name = "${{ inputs.builder_name }}"
            runner_os = "${{ runner.os }}"
            runner_arch = "${{ runner.arch }}"
            status = if (${{ steps.run_tests.outcome == 'success' }}) { "pass" } else { "fail" }
          } | ConvertTo-Json
          $meta | Out-File -FilePath "${{ github.workspace }}\build-metadata.json" -Encoding utf8

      - name: Upload metadata artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata-${{ inputs.commit_sha }}
          path: build-metadata.json
          retention-days: 7
