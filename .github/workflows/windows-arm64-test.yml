# This workflow is triggered by LUCI (via the gabuilder bridge) to run
# Go tests on windows/arm64 GitHub Actions runners. It checks out the
# Go source tree at the requested commit, bootstraps the toolchain,
# and runs the test suite. Results are uploaded as artifacts and the
# workflow exit status is used by the bridge to report back to LUCI.

name: windows-arm64-test

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Go repository commit SHA to test"
        required: true
        type: string
      build_id:
        description: "LUCI build ID for correlation"
        required: false
        type: string
        default: ""
      test_shards:
        description: "Number of test shards (GO_TEST_SHARDS)"
        required: false
        type: string
        default: "1"
      builder_name:
        description: "GO_BUILDER_NAME to set in environment"
        required: false
        type: string
        default: "gotip-windows-arm64-github"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      GO_BUILDER_NAME: ${{ inputs.builder_name }}
      GO_TEST_SHARDS: ${{ inputs.test_shards }}
      GOROOT_BOOTSTRAP: C:\hostedtoolcache\go\bootstrap

    steps:
      - name: Checkout Go source
        uses: actions/checkout@v4
        with:
          repository: golang/go
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Set up bootstrap Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Record bootstrap location
        shell: pwsh
        run: |
          $bootstrapDir = Split-Path -Parent (Get-Command go).Source
          # Go bootstrap expects GOROOT_BOOTSTRAP to point to the root,
          # not the bin directory.
          $goroot = Split-Path -Parent $bootstrapDir
          echo "GOROOT_BOOTSTRAP=$goroot" >> $env:GITHUB_ENV
          echo "Bootstrap GOROOT: $goroot"
          go version

      - name: Set up ARM64-capable C compiler
        shell: pwsh
        run: |
          # Git-for-Windows ships an x86-64 MinGW gcc that cannot compile ARM64 assembly.
          # Replace it with LLVM clang (pre-installed on this image) targeting
          # aarch64-pc-windows-msvc, using the MSVC ARM64 toolchain for linking.
          #
          # Find Visual Studio and activate the ARM64 MSVC environment so that
          # clang can find the ARM64 CRT and SDK libs.
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath 2>$null
          if (-not $vsPath) {
            # Try without the ARM64 requirement in case the name changed
            $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -property installationPath 2>$null
          }
          Write-Output "VS path: $vsPath"

          # Locate vcvarsall.bat
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvarsall.bat not found at $vcvars"
            exit 1
          }

          # Run vcvarsall for arm64 and export path/lib/include changes to GITHUB_ENV
          $output = cmd /c "`"$vcvars`" arm64 && set"
          $output | ForEach-Object {
            if ($_ -match '^(PATH|LIB|LIBPATH|INCLUDE|VCTOOLSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|VCINSTALLDIR)=(.+)$') {
              $name = $matches[1]
              $val  = $matches[2]
              echo "$name=$val" >> $env:GITHUB_ENV
            }
          }

          # LLVM clang is pre-installed; make sure it is on PATH and set CC/CXX
          $llvmBin = "C:\Program Files\LLVM\bin"
          echo $llvmBin >> $env:GITHUB_PATH
          Write-Output "clang: $(& "$llvmBin\clang.exe" --version 2>&1 | Select-Object -First 1)"

          # Tell the Go build to use clang (which will auto-detect the MSVC sysroot via VCTOOLSINSTALLDIR)
          echo "CC=clang" >> $env:GITHUB_ENV
          echo "CXX=clang++" >> $env:GITHUB_ENV

      - name: Build Go toolchain
        shell: pwsh
        working-directory: src
        run: |
          echo "::group::make.bat"
          .\make.bat
          echo "::endgroup::"

      - name: Run tests
        id: run_tests
        shell: pwsh
        working-directory: src
        run: |
          $env:PATH = "${{ github.workspace }}\bin;$env:PATH"
          echo "Using Go: $(go version)"
          echo "Builder: $env:GO_BUILDER_NAME"
          echo "Build ID: ${{ inputs.build_id }}"
          echo "::group::run.bat"
          .\run.bat 2>&1 | Tee-Object -FilePath "${{ github.workspace }}\test-output.txt"
          $exitCode = $LASTEXITCODE
          echo "::endgroup::"
          echo "test_exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          exit $exitCode

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.commit_sha }}
          path: test-output.txt
          retention-days: 7

      - name: Upload build metadata
        if: always()
        shell: pwsh
        run: |
          $meta = @{
            commit_sha = "${{ inputs.commit_sha }}"
            build_id = "${{ inputs.build_id }}"
            builder_name = "${{ inputs.builder_name }}"
            runner_os = "${{ runner.os }}"
            runner_arch = "${{ runner.arch }}"
            status = if (${{ steps.run_tests.outcome == 'success' }}) { "pass" } else { "fail" }
          } | ConvertTo-Json
          $meta | Out-File -FilePath "${{ github.workspace }}\build-metadata.json" -Encoding utf8

      - name: Upload metadata artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata-${{ inputs.commit_sha }}
          path: build-metadata.json
          retention-days: 7
